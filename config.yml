# Alert dismissal triage configuration

# Required enterprise URL slug. The App must be owned by this enterprise.
# organization is not supported. No organization allowlist is needed.
enterprise: avocado-corp

# deterministic: deny comments that fail the configured criteria.
# agentic: dispatch every created request to the gh-aw workflow.
# both: deny deterministic failures and dispatch passing requests.
review_mode: both

# Optional deterministic criteria. If all are omitted, every comment passes.
# required_phrase: "mitigating control"
# URL-format check only; agentic evidence remains restricted to the target org.
required_pattern: "https://github\\.com/[a-zA-Z0-9-]+/[a-zA-Z0-9._-]+/issues/\\d+"
# minimum_length: 20
case_sensitive: false

# All three official dismissal-request webhook categories are enabled by
# default. Remove a value to ignore that subscribed event safely.
alert_types:
  - code_scanning
  - dependabot
  - secret_scanning

agentic:
  # Central repository that runs the agentic workflows. The GitHub App must
  # also be installed on this repository (or its owner) with Contents: write
  # so it can create repository_dispatch events.
  # Replace this example with a repository in your enterprise.
  workflow_repository: callmegreg-demo-org/agentic-alert-triage

  # Copilot model used by the agentic workflow.
  model: gpt-5-mini

  # One enterprise team, assumed to hold the enterprise Security Manager role.
  # Use the full enterprise team slug, including GitHub's ent: prefix.
  # The App needs an enterprise installation with Enterprise teams: read.
  appsec_team_slug: ent:appsec-team

  # Preview SafeOutput decisions until the workflow has been evaluated.
  staged: false

  # Defaults to "Enterprise AppSec team in your alert (@/<appsec_team_slug>)"
  # when omitted.
  # help_contact: "Enterprise security desk"

  # Optional denial template. Available placeholders:
  # {requester}, {denial_reason}, {help_contact}, {alert_type},
  # {alert_number}, {repo_full_name}
  # denial_message: |
  #   DISMISSAL REQUEST DENIED.
  #   Reason: {denial_reason}
  #   For more help, mention the {help_contact}

# Short-lived, bounded process-local caches reduce duplicate webhook work and
# GitHub API calls. They are not a durable queue or cross-replica lock.
cache:
  app_identity_ttl_seconds: 600
  enterprise_installation_ttl_seconds: 600
  team_members_ttl_seconds: 300
  control_installation_ttl_seconds: 600
  delivery_dedupe_ttl_seconds: 900
  delivery_dedupe_max_entries: 1000

# Deterministic denial placeholders:
# {alert_type}, {alert_number}, {required_phrase}, {denial_reason},
# {requester}, {repo_full_name}
denial_message: |
  DISMISSAL REQUEST DENIED
  Review: Automated criteria
  Alert: {alert_type} #{alert_number}
  Requester: {requester}
  Status: The dismissal comment did not meet the required criteria
  Reason: {denial_reason}
  Next step: Create a supporting issue, then add its URL to a new dismissal request: https://github.com/{repo_full_name}/issues/new
